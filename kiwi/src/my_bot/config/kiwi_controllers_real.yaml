controller_manager:
  ros__parameters:
    update_rate: 30          # Hz - keep equal to PID_RATE in the ESP32 firmware and loop_rate in ros2_control.xacro
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

wheel_velocity_controller:
  ros__parameters:
    joints:
      - wheel_1_joint
      - wheel_2_joint
      - wheel_3_joint
